<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Academic Reading - Mock Test 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bar:#222;--bg:#f5f5f5;--white:#fff;--text:#111;--text-mid:#555;
  --text-light:#888;--border:#ddd;--border-dark:#bbb;--green:#2e7d32;--green-light:#e8f5e9;
  --red:#c62828;--red-light:#ffebee;--blue:#1565c0;--blue-light:#e3f2fd;
  --hl-y:rgba(255,235,59,.38);--hl-g:rgba(129,199,132,.35);--hl-b:rgba(100,181,246,.35);
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
.screen{display:none}.screen.active{display:flex;flex-direction:column;height:100vh}

/* ENTRY */
.entry-screen.active{align-items:center;justify-content:center;background:#fafafa;overflow-y:auto}
.entry-card{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:44px 48px;max-width:500px;width:92%;text-align:center;margin:auto}
.entry-card h1{font-size:20px;font-weight:700;margin-bottom:4px}
.entry-card .sub{font-size:13px;color:var(--text-mid);margin-bottom:24px}
.info-box{text-align:left;background:#fafafa;border:1px solid var(--border);padding:14px 18px;margin-bottom:20px;font-size:13px;line-height:1.8;color:var(--text-mid)}
.info-box strong{color:var(--text)}
.entry-input{width:100%;padding:12px 16px;border:1px solid var(--border-dark);font-size:15px;outline:none;margin-bottom:16px}
.entry-input:focus{border-color:var(--text)}
.entry-input::placeholder{color:#aaa}
.btn-start{width:100%;padding:12px;background:var(--bar);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer}
.btn-start:hover{background:#000}
.entry-err{color:var(--red);font-size:12px;margin-bottom:10px;display:none}

/* TOP BAR */
.top-bar{height:46px;background:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff;flex-shrink:0;gap:12px}
.top-bar .left{display:flex;align-items:center;gap:12px;min-width:0}
.top-bar .right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.top-bar .title{font-size:13px;font-weight:600;white-space:nowrap}
.name-tag{font-size:11px;color:#bbb;background:rgba(255,255,255,.08);padding:3px 10px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.timer{font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;letter-spacing:1px}
.timer.warn{color:#ef5350;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.btn-submit{padding:8px 22px;background:#fff;color:var(--bar);border:none;font-size:12.5px;font-weight:700;cursor:pointer;border-radius:2px}
.btn-submit:hover{background:#e0e0e0}
.btn-submit:disabled{background:#555;color:#999;cursor:default}

/* TABS */
.section-tabs{height:36px;background:#2a2a2a;display:flex;align-items:stretch;padding:0 8px;gap:1px;flex-shrink:0;overflow-x:auto}
.section-tab{padding:0 20px;display:flex;align-items:center;font-size:12px;font-weight:600;color:#777;cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;white-space:nowrap}
.section-tab.active{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.06)}
.section-tab:hover{color:#ccc}

/* CLEAR BAR */
.clear-bar{height:30px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;flex-shrink:0;gap:14px}
.clear-bar button{font-size:11px;color:var(--text-light);background:none;border:1px solid var(--border);padding:2px 12px;cursor:pointer;border-radius:2px}
.clear-bar button:hover{background:#f0f0f0;color:var(--text)}
.clear-bar .hint{font-size:11px;color:#aaa}

/* SPLIT */
.main-wrap{display:flex;flex:1;overflow:hidden}
.panel{flex:1;overflow-y:auto;padding:26px 30px 90px}
.panel::-webkit-scrollbar{width:7px}
.panel::-webkit-scrollbar-track{background:#eee}
.panel::-webkit-scrollbar-thumb{background:#c0c0c0;border-radius:3px}
.passage-panel{background:var(--white);border-right:1px solid var(--border)}
.question-panel{background:#fafafa}
.resizer{width:5px;cursor:col-resize;background:var(--border);flex-shrink:0;z-index:10}
.resizer:hover,.resizer.on{background:#999}

/* PASSAGE */
.passage-kicker{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-light);margin-bottom:6px}
.passage-title{font-size:19px;font-weight:700;margin-bottom:8px;line-height:1.35}
.passage-sub{font-size:13.5px;font-style:italic;color:var(--text-mid);margin-bottom:16px;line-height:1.6}
.passage-body{font-size:14.5px;line-height:1.9;color:#222}
.passage-body p{margin-bottom:12px;text-align:justify}
.plabel{font-weight:700;margin-right:5px}
mark.hl-y{background:var(--hl-y);padding:1px 0;border-radius:2px}
mark.hl-g{background:var(--hl-g);padding:1px 0;border-radius:2px}
mark.hl-b{background:var(--hl-b);padding:1px 0;border-radius:2px}

/* NOTES */
mark[data-note]{position:relative;cursor:pointer}
mark[data-note]::after{content:"";position:absolute;top:-3px;right:-6px;width:8px;height:8px;background:var(--blue);border-radius:50%;border:1px solid #fff}
.note-tooltip{position:fixed;z-index:150;background:#333;color:#fff;padding:8px 12px;border-radius:4px;font-size:12px;max-width:240px;line-height:1.5;white-space:pre-wrap;display:none}
.note-tooltip.show{display:block}
.note-tooltip .nt-close{display:block;margin-top:6px;font-size:11px;color:#8af;cursor:pointer;text-align:right}

/* SELECTION POPUP */
.sel-popup{position:fixed;z-index:160;background:var(--white);border:1px solid var(--border-dark);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:none;padding:6px 4px;gap:2px;flex-direction:row;align-items:center}
.sel-popup.show{display:flex}
.sp-color{width:24px;height:24px;border-radius:4px;border:2px solid transparent;cursor:pointer}
.sp-color:hover{transform:scale(1.12);border-color:#999}
.sp-color.cy{background:rgba(255,235,59,.7)}.sp-color.cb{background:rgba(100,181,246,.6)}.sp-color.cg{background:rgba(129,199,132,.6)}
.sp-divider{width:1px;height:20px;background:var(--border);margin:0 4px}
.sp-note{display:flex;align-items:center;gap:4px;padding:4px 8px;cursor:pointer;border-radius:4px;font-size:12px;font-weight:600;color:var(--text-mid);border:none;background:none}
.sp-note:hover{background:#f0f0f0;color:var(--text)}

/* NOTE INPUT */
.note-input-wrap{position:fixed;z-index:170;background:var(--white);border:1px solid var(--border-dark);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:10px;display:none;width:240px}
.note-input-wrap.show{display:block}
.note-input-wrap textarea{width:100%;height:60px;border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:12.5px;resize:none;outline:none;font-family:inherit}
.note-input-wrap .ni-btns{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.note-input-wrap .ni-btn{padding:4px 12px;font-size:11px;font-weight:600;border:none;border-radius:3px;cursor:pointer}
.ni-save{background:var(--bar);color:#fff}.ni-cancel{background:#eee;color:var(--text-mid)}

/* QUESTIONS */
.q-block{margin-bottom:26px}
.q-instruction{font-size:13px;color:var(--text-mid);margin-bottom:14px;line-height:1.7;padding:11px 14px;background:var(--white);border:1px solid var(--border);border-left:3px solid var(--bar)}
.q-instruction strong{color:var(--text)}
.opt-box{background:var(--white);border:1px solid var(--border-dark);padding:12px 16px;margin-bottom:14px;font-size:13px;line-height:1.85}
.opt-box .ob-title{font-weight:700;margin-bottom:6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
.opt-box .ob-item{display:flex;gap:8px}
.opt-box .ob-key{font-weight:700;min-width:26px}
.q-card{margin-bottom:12px;padding:13px 15px;background:var(--white);border:1px solid #e5e5e5}
.q-card:hover{border-color:var(--border-dark)}
.q-card.is-correct{border-color:var(--green);background:var(--green-light)}
.q-card.is-wrong{border-color:var(--red);background:var(--red-light)}
.q-head{display:flex;align-items:flex-start;gap:10px}
.q-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#e0e0e0;font-size:12px;font-weight:700;flex-shrink:0}
.q-num.done{background:var(--green);color:#fff}
.q-stem{font-size:14px;line-height:1.55;flex:1}
.q-opts{margin-top:9px;padding-left:36px}
.q-opt{display:flex;align-items:flex-start;gap:9px;padding:6px 10px;margin-bottom:3px;cursor:pointer;font-size:13.5px;line-height:1.55;border-radius:3px;user-select:none}
.q-opt:hover{background:#f0f0f0}
.q-opt input{accent-color:var(--bar);margin-top:3px;cursor:pointer;width:15px;height:15px;flex-shrink:0}
.q-opt span{flex:1}
.q-sel{margin-top:8px;margin-left:36px;padding:7px 10px;font-size:13.5px;border:1px solid var(--border-dark);background:var(--white);min-width:230px;font-family:inherit;cursor:pointer}
.q-sel:focus{outline:none;border-color:var(--bar)}
.multi-hint{font-size:11.5px;color:var(--text-light);padding-left:36px;margin-top:6px}
.multi-hint.full{color:var(--green);font-weight:600}

/* SUMMARY / NOTE COMPLETION */
.sum-card{margin-bottom:14px;padding:16px 18px;background:var(--white);border:1px solid var(--border-dark)}
.sum-title{text-align:center;font-style:italic;font-weight:700;font-size:14px;margin-bottom:12px}
.sum-body{font-size:14px;line-height:2.15;text-align:justify}
.sum-body.notes{text-align:left}
.sum-body ul{list-style:none;margin:0 0 8px 6px}
.sum-body li{position:relative;padding-left:16px;line-height:2.1}
.sum-body li::before{content:"\25CF";position:absolute;left:0;font-size:9px;top:1px}
.note-h{font-weight:700;margin-top:6px}
.sum-inp{display:inline-block;width:130px;padding:3px 7px;border:none;border-bottom:2px solid var(--bar);background:#f7f7f7;font-size:13.5px;font-family:inherit;outline:none}
.sum-inp:focus{background:#fff8dc}
.sum-inp.blank-ok{border-bottom-color:var(--green);background:var(--green-light);color:var(--green);font-weight:600}
.sum-inp.blank-no{border-bottom-color:var(--red);background:var(--red-light);color:var(--red);font-weight:600}
.sum-num{display:inline-block;font-weight:700;font-size:11.5px;background:#e0e0e0;border-radius:3px;padding:1px 5px;margin-right:3px}
.sum-num.done{background:var(--green);color:#fff}
.sum-fb{margin-top:14px;border-top:1px solid var(--border);padding-top:10px}

/* FEEDBACK */
.fb-verdict{font-size:12px;font-weight:700;margin-top:8px;padding-left:36px}
.fb-verdict.ok{color:var(--green)}.fb-verdict.no{color:var(--red)}
.fb-explain{margin-top:10px;padding:13px 15px;background:#f9f9f9;border:1px solid var(--border);border-left:3px solid var(--blue);font-size:13px;line-height:1.75;color:#333}
.fb-explain .step{font-weight:700;color:var(--blue);display:block;margin-top:9px;margin-bottom:2px}
.fb-explain .step:first-child{margin-top:0}
.fb-explain .kw{margin:2px 0 0 10px;font-size:12.5px;color:var(--text-mid)}
.fb-explain .distractor{margin-top:6px;padding-left:8px;border-left:2px solid #ddd;font-size:12.5px;line-height:1.7;color:var(--text-mid)}
.fb-explain .distractor strong{color:var(--text)}
.fb-item{padding:10px 12px;border:1px solid var(--border);background:#fafafa;margin-bottom:8px;font-size:13px;line-height:1.7}
.fb-item.ok{border-left:3px solid var(--green)}
.fb-item.no{border-left:3px solid var(--red)}
.fb-item b{font-weight:700}

/* BOTTOM BAR */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;height:46px;background:var(--bar);display:flex;align-items:center;padding:0 12px;z-index:100;overflow-x:auto}
.qnav{display:flex;gap:3px;align-items:center}
.qnav-sep{width:1px;height:20px;background:#555;margin:0 7px;flex-shrink:0}
.qnav-lb{font-size:10px;color:#888;font-weight:700;margin-right:5px;flex-shrink:0}
.qnav-btn{width:26px;height:26px;border-radius:3px;border:1px solid #444;background:#333;color:#888;font-size:10.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qnav-btn:hover{background:#444;color:#ccc}
.qnav-btn.done{background:var(--green);color:#fff;border-color:var(--green)}
.qnav-btn.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.qnav-btn.cur{outline:2px solid #fff;outline-offset:1px}

/* PRIVACY */
.privacy-shield{position:fixed;inset:0;z-index:9999;background:rgba(20,20,20,.85);display:none;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:15px;font-weight:600;line-height:1.6;padding:24px}
.privacy-shield.show{display:flex}
body.shielded .screen{filter:blur(16px);pointer-events:none}

/* MODAL CONFIRM */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.confirm-card{background:var(--white);border:1px solid var(--border);padding:28px 32px;max-width:420px;width:100%;text-align:center}
.confirm-card h3{font-size:16px;font-weight:700;margin-bottom:8px}
.confirm-card p{font-size:13.5px;color:var(--text-mid);line-height:1.7;margin-bottom:18px}
.cf-btns{display:flex;gap:10px}
.cf-btn{flex:1;padding:11px;border:none;font-size:13px;font-weight:600;cursor:pointer}
.cf-yes{background:var(--bar);color:#fff}.cf-yes:hover{background:#000}
.cf-no{background:#eee;color:var(--text-mid);border:1px solid var(--border)}

/* RESULTS */
.result-card{background:var(--white);border:1px solid var(--border);padding:34px 40px;max-width:500px;width:100%;text-align:center;max-height:90vh;overflow-y:auto}
.result-card h2{font-size:20px;font-weight:700;margin-bottom:2px}
.rname{font-size:13px;color:var(--text-mid);margin-bottom:12px}
.raw-big{font-size:52px;font-weight:800;margin:6px 0 0;line-height:1.1}
.raw-big small{font-size:18px;color:var(--text-light);font-weight:400}
.raw-pct{font-size:15px;font-weight:600;color:var(--blue);margin-bottom:10px}
.no-band{font-size:12px;color:var(--text-mid);background:#fff8e1;border:1px solid #ffe082;padding:9px 12px;line-height:1.6;text-align:left;margin:10px 0 14px}
.result-stats{display:flex;justify-content:center;gap:22px;margin:12px 0 16px;flex-wrap:wrap}
.rs{text-align:center}.rv{font-size:22px;font-weight:700}.rl{font-size:10.5px;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px}
.rs-ok .rv{color:var(--green)}.rs-no .rv{color:var(--red)}
.sec-break{display:flex;justify-content:center;gap:10px;font-size:12px;color:var(--text-mid);margin-bottom:14px;flex-wrap:wrap}
.sec-break span{background:#f2f2f2;border:1px solid var(--border);padding:4px 10px;border-radius:2px}
.rbtn{display:block;width:100%;padding:11px;border:none;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px}
.rbtn-review{background:var(--bar);color:#fff}.rbtn-review:hover{background:#000}
.rbtn-again{background:var(--white);color:var(--text-mid);border:1px solid var(--border)}

/* ANALYSIS */
.analysis-screen.active{display:block;height:auto;min-height:100vh;overflow-y:auto}
.analysis-wrap{max-width:820px;margin:0 auto;padding:38px 22px 70px}
.analysis-wrap h2{font-size:21px;font-weight:700;margin-bottom:4px}
.asub{font-size:13px;color:var(--text-mid);margin-bottom:26px}
.a-section{margin-bottom:30px}
.a-section h3{font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:14px}
.a-wrong-item{padding:11px 15px;background:var(--red-light);border:1px solid #ffcdd2;margin-bottom:9px;font-size:13px;line-height:1.65}
.a-wrong-item .aq{font-weight:600;color:var(--red)}
.a-wrong-item .adetail{color:#555;margin-top:4px}
.a-tip{padding:14px 18px;background:var(--blue-light);border:1px solid #bbdefb;margin-bottom:10px;font-size:13.5px;line-height:1.75}
.a-tip strong{color:var(--blue)}
.a-tip ul{margin:6px 0 0 18px}
.a-tip li{margin-bottom:4px}
.a-note{font-size:12px;color:var(--text-mid);margin-bottom:8px}

/* PARAPHRASE TABLE */
.ptable{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--white);margin-bottom:14px}
.ptable th,.ptable td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.6}
.ptable th{background:#f0f0f0;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.ptable td:first-child{width:34%}
.ptable td:nth-child(2){width:34%}

/* GRAMMAR */
.gram-box{background:var(--white);border:1px solid var(--border);border-left:3px solid var(--bar);padding:12px 15px;margin-bottom:10px;font-size:13px;line-height:1.75}
.gram-box .gname{font-weight:700;font-size:13px;margin-bottom:3px}
.gram-box .gex{font-style:italic;color:#333;background:#f7f7f7;padding:6px 9px;margin:5px 0;border-radius:2px}
.gram-box .guse{color:var(--text-mid);font-size:12.5px}

/* COLLOCATION CHIPS - CLICK to open */
.a-vocab{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.col-chip{position:relative;background:var(--white);border:1px solid var(--border);padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;border-radius:3px;user-select:none}
.col-chip:hover{background:#e3f2fd;border-color:var(--blue)}
.col-chip.open{background:#e3f2fd;border-color:var(--blue)}
.col-chip .col-detail{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 16px;border-radius:6px;min-width:250px;max-width:320px;z-index:80;text-align:left;font-weight:400;font-size:12.5px;line-height:1.7;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.col-chip.open .col-detail{display:block}
.col-detail .cd-word{font-size:14px;font-weight:700;color:#8ab4ff;margin-bottom:2px}
.col-detail .cd-ipa{font-size:12px;color:#aaa;margin-bottom:6px;font-style:italic}
.col-detail .cd-vi{color:#ffd54f;font-weight:600;margin-bottom:4px}
.col-detail .cd-ex{color:#ccc;font-size:11.5px;font-style:italic}
.abtn-back{display:inline-block;margin-top:18px;padding:10px 30px;background:var(--bar);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer}
.abtn-back:hover{background:#000}

@media(max-width:820px){
  .main-wrap{flex-direction:column}
  .resizer{width:100%;height:5px;cursor:row-resize}
  .panel{padding:16px 14px 80px}
  .entry-card{padding:30px 20px}
  .top-bar .title{display:none}
  .ptable td:first-child,.ptable td:nth-child(2){width:auto}
}
</style>
</head>
<body>

<div class="screen entry-screen active" id="screenEntry">
  <div class="entry-card">
    <h1>IELTS Academic Reading</h1>
    <div class="sub">Computer-Based Practice Test - Mock Test 2</div>
    <div class="info-box">
      <strong>Total:</strong> 40 questions<br>
      <strong>Time:</strong> 60 minutes
    </div>
    <div class="entry-err" id="entryErr">Please enter your name to begin.</div>
    <input class="entry-input" id="nameInput" type="text" placeholder="What is your name?" autofocus>
    <button class="btn-start" onclick="beginTest()">START TEST</button>
  </div>
</div>

<div class="screen" id="screenTest">
  <div class="top-bar">
    <div class="left"><div class="title">IELTS Academic Reading</div><div class="name-tag" id="barName"></div></div>
    <div class="right">
      <div class="timer" id="timer">60:00</div>
      <button class="btn-submit" id="btnSubmit" onclick="submitTest()">SUBMIT</button>
    </div>
  </div>
  <div class="section-tabs" id="secTabs"></div>
  <div class="clear-bar">
    <button onclick="clearAllHL()">Clear all highlights &amp; notes</button>
    <span class="hint">Boi den van ban de highlight hoac ghi chu</span>
  </div>
  <div class="main-wrap" id="mainWrap">
    <div class="panel passage-panel" id="passagePanel"></div>
    <div class="resizer" id="resizer"></div>
    <div class="panel question-panel" id="questionPanel"></div>
  </div>
  <div class="bottom-bar"><div class="qnav" id="qNav"></div></div>
</div>

<div class="screen analysis-screen" id="screenAnalysis"></div>

<div class="sel-popup" id="selPopup">
  <div class="sp-color cy" onclick="applyHL('y')"></div>
  <div class="sp-color cb" onclick="applyHL('b')"></div>

var P1_HTML=""
+"<p>Sydney Opera House is an example of late modern architecture; it is admired internationally and treasured by the people of Australia.</p>"
+"<p>In 1956 the Premier of New South Wales, Australia, announced an international competition for the design of an opera house for Sydney. It attracted more than 200 entries from around the world and was won by Jørn Utzon, a relatively little-known architect from Denmark. The story goes that during the judging of the competition, one judge, American architect Eero Saarinen, arrived in Sydney after the other three judges had started assessing the entries. He looked through their rejected entries and stopped at the Utzon design, declaring it to be outstanding.</p>"
+"<p>It was Utzon’s life and travels that had shaped his design for the Sydney Opera House. Though he had never visited the site, he used his maritime background to study naval charts of Sydney Harbour. His early exposure to shipbuilding provided the inspiration for the design of the roof, which is a series of curved ’shells’ that look like the sails of a sailing ship billowing in the wind. From his travels to Mexico, he had the idea of placing his building on a wide horizontal platform.</p>"
+"<p>Construction of the platform began in 1959, and throughout the early 1960s Utzon amended his original designs in order to develop a way to build the large ’shells’ that cover the two main halls. The construction of the roof brought together some of the world’s best engineers and craftsmen, devising innovative techniques to create a major visual impact in accordance with Utzon’s vision. The design was one of the first examples of the use of computer-aided design for complex shapes.</p>"
+"<p>Although Utzon had spectacular plans for the interior, he was unable to realise them. Cost overruns contributed to criticism of the project and, after a change of government, the Minister of Works began questioning Utzon’s schedules and cost estimates. Payments to Utzon were stopped and he was forced to withdraw as chief architect in 1966. Following his resignation, there were protests through the streets led by prominent architect Harry Seidler and others, demanding that Utzon be reinstated as architect. However, Utzon was not reinstated and left Australia in 1966. He never returned, and new architects were appointed to complete the building in his absence.</p>"
+"<p>The original cost estimate for the Opera House was $7 million with the completion date set for 26 January 1963. However, the Opera House was not formally completed until 1973 having cost $102 million.</p>"
+"<p>Since its opening in 1973, Sydney Opera House has earned a reputation as a world-class performing arts centre and become a symbol of both Sydney and Australia. Situated at Bennelong Point on Sydney Harbour, it consists of a series of large precast ’shells’ made of concrete, each composed of sections of a sphere of 75.2 metres radius, forming the roofs of the structure, set on a monumental platform. The building is 183 metres long and 120 metres wide at its widest point. It is supported on 588 concrete piers, which are sunk approximately 25 metres below sea level.</p>"
+"<p>Although the roof structures are commonly referred to as ’shells’, they are precast concrete panels supported by concrete ribs. The ’shells’ are covered with 1,056,006 white and cream-coloured tiles manufactured in a factory in Sweden that generally produced stoneware tiles for the paper-mill industry. The design solution and construction of the shell structure took eight years to complete, and the development of the special ceramic tiles took over three years. Apart from the tiles covering the ’shells’, the building’s exterior is mostly clad with granite quarried in Australia.</p>"
+"<p>Contrary to its name, Sydney Opera House includes multiple performance venues. It is among the busiest performing-arts centres in the world, holding over 1,500 performances each year. It hosts a large number of performing-arts companies, including the four resident companies: Opera Australia, the Australian Ballet, the Sydney Theatre Company and the Sydney Symphony Orchestra.</p>"
+"<p>With its grand setting and cathedral-like atmosphere, the Concert Hall is Sydney Opera House’s most prestigious performance space. The largest of all interior venues, it delivers outstanding acoustics thanks to its high ceiling and wood panelling. There is a sizeable outdoor forecourt from which people ascend to the main entrance. The steps, which lead up from the forecourt to the main performance venues, are nearly 100 metres wide.</p>"
+"<p>In 1999 Utzon was re-engaged to develop a set of design principles to act as a guide for future changes to the building. All of this design work he did from his base in Europe. These principles help to ensure that the building’s architectural integrity is maintained. The first alteration to the exterior was the addition of a new colonnade, which shades nine large glass openings in the previously solid exterior wall. This Utzon-led project, completed in 2006, enabled theatre patrons to see the harbour for the first time from the theatre foyers. The design also incorporates the first public lift and interior escalators to assist less-mobile patrons.</p>"
+"<p>Since 2007, the cultural, heritage and architectural importance of Sydney Opera House has been protected by its inclusion on the World Heritage List.</p>";

var P2_HTML=""
+"<p><span class='plabel'>A</span> Just over a kilometre south of Berlin’s Potsdamer Platz, near the left bank of the Landwehr Canal, an extensive, triangular-shaped area of waste ground once separated the neighbourhoods of Kreuzberg to the east and Schöneberg to the west. Known as Gleisdreieck, meaning ‘triangle of rails’, it was formed by the intersection of different railway lines built in the mid-nineteenth century that entered Berlin from the south. Tracks, sheds and warehouses belonging to three old railway stations - Dresdner Bahnhof (1875-1882), Potsdamer Bahnhof (1838-1944) and Anhalter Bahnhof (1839-1952) - are situated on a raised area some twenty hectares in size, at a height of four metres above the surrounding ground level.</p>"
+"<p><span class='plabel'>B</span> As the railway infrastructure gradually ceased to be used, the whole area of Gleisdreieck became increasingly run down and abandoned, to the point of being used as a rubbish tip after 1945. Meanwhile, vegetation took over, turning it into a surprising, natural haven in the middle of built-up areas. The closeness of the wall which divided the city of Berlin between 1961 and 1990 also contributed to the fact that Gleisdreieck was for decades clearly identified as no-man’s-land. Only a station of the same name in Berlin’s underground railway system testified to its existence. Shortly before the fall of the Berlin Wall, however, the German Museum of Technology was established there, attracting large numbers of visitors and giving visibility to the site. More importantly, the unification of the formerly divided city gave the location more centrality, at which point it became imperative to identify a purpose for it.</p>"
+"<p><span class='plabel'>C</span> After 2006, the State of Berlin put forward the proposal of converting Gleisdreieck into a large urban park that would integrate the different urban zones which converged there. The decades-long isolation of the site, which had formerly presented a problem, now represented an opportunity for joining the southern area of Potsdamer Platz with Kreuzberg and Schöneberg. The creation of the park would trigger one of the biggest urban expansions inside Berlin, all within a framework of multiple uses, and social characteristics. It was necessary to stimulate the development of sixteen new hectares of local amenities that would be capable of integrating different generations and social groups in a sustainable way, and in harmony with nature. Following intense discussion with local proprietors and residents, the need to reconcile these goals with the conservation of railway heritage also emerged.</p>"
+"<p><span class='plabel'>D</span> Once the area had been subjected to a process of undergrowth clearance and decontamination, it was then organized around a combination of existing and added elements. The project as a whole was planned around a large central meadow, intersected from east to west by a concrete footpath, and from north to the south by a pair of railway lines. Once a month, a train slowly travels along these lines from its parking shed to the German Museum of Technology. The concrete footpath, which is a continuation of one of the main Kreuzberg boulevards, starts in the east, bridges the four-metre difference in ground level by means of a stairway, and suddenly ends in the west on reaching the underground lines.</p>"
+"<p><span class='plabel'>E</span> North of the meadow, there is a large concrete slab with rounded edges. Being south-facing, this functions as a big sunny terrace, full of benches complete with footrests. In the south, the meadow overlooks Yorckstrasse, an underpass crossed by more than fifteen former railway bridges. To the east of the meadow there is quite a dense forest of pre-existing maples, oaks and birches, as well as newly planted trees of the same species. In this area, a couple of large metal frames each hold two swings. The edges of the park are finished with a collection of distinctive, functional spaces, for example a nursery, sports fields, concave surfaces for skateboards, stages for dancing, community gardens, or simply areas covered in gravel obtained from the site itself.</p>"
+"<p><span class='plabel'>F</span> Although initially the regeneration of Gleisdreieck Park was the subject of disagreement between those who were in favour of safeguarding the railway heritage, and those who wanted to regenerate the adjacent neighbourhoods, it was opened to the public in September 2011. The heart of Berlin now has a new green lung, in which the atmosphere of various small, very different corners fit neatly into a large-scale, wide-ranging and robust general order. This has been possible precisely because the intervention was not limited to conserving industrial remains in order to promote railway history. And as a reminder of the six decades of human absence, during which nature took over, the park has been able to conserve to some extent the spirit of the non-place that preceded it.</p>";

var P3_HTML=""
+"<p>Want to devise a new form of alternative medical treatment? No problem. Here’s the recipe. As a practitioner, be warm, sympathetic, reassuring, and enthusiastic. Your treatment should involve physical contact, and each session with your patients should take at least half an hour. Encourage your patients to take an active part in their treatment and understand how their disorders relate to the rest of their lives. Tell them that their own bodies possess the power to heal. Get them to pay you well. Describe your treatment in familiar words, but embellish with a hint of mysticism: energy fields, energy flows, energy blocks, meridians, forces, auras, rhythms, and the like. Refer to the knowledge of an early age: wisdom carelessly swept aside by the rise of blind mechanistic science. Oh, come off it, you’re saying. Something like that couldn’t possibly work, could it?</p>"
+"<p>Well yes, it could - and often well enough to earn you a living. And a very good living if you are sufficiently convincing or, better still, really believe in your therapy. Many illnesses get better on their own, so if you are lucky and administer your treatment at just the right time, you’ll get the credit. But that’s only part of it. Some of the improvement really would be down to you. Not necessarily because you’d recommend acupuncture rather than chamomile tea or used this crystal as opposed to that pressure point. Nothing so specific. Your healing power would be the outcome of a paradoxical force that conventional medicine recognizes but remains oddly ambivalent about: the placebo effect.</p>"
+"<p>Placebos are treatments that have no direct effect on the body, yet still work because the patient has faith in their power to heal. Most often the term refers to a dummy pill, but it applies just as much to any device or procedure, from a sticking plaster to a crystal. The existence of the placebo effect implies that even a complete fraud could make a difference to someone’s health, which is why most practitioners of alternative medicine are sensitive about any mention of the subject. In fact, the placebo is a powerful part of all medical care, orthodox or otherwise, though its role is often neglected and misunderstood.</p>"
+"<p>At one level, it should come as no surprise that our state of mind can influence our physiology: anger opens the superficial blood vessels of the face; sadness pumps the tear glands. But exactly how placebos work their medical magic is still largely unknown. Most of the scant research to date has focused on the control of pain, because it’s one of the commonest complaints and lends itself to experimental study. Here, attention has turned to the endorphins, natural substances produced in the brain that are known to help control pain. “Any of the neurochemicals involved in transmitting pain impulses or modulating them might also be involved in generating the placebo response,” says Don Price, an oral surgeon at the University of Florida.</p>"
+"<p>That case has been strengthened by the recent work of Fabrizio Benedetti of the University of Turin, who showed that the placebo effect can be abolished by a drug, naloxone, which blocks the effects of endorphins. Benedetti induced pain in volunteers by applying a pressure cuff on the forearm. He did this several times a day for several days, using morphine each time to control the pain. On the final day, without saying anything, he replaced the morphine with a saline solution. This still relieved the subjects’ pain: a placebo effect. But when he added naloxone to the saline and blocked the endorphins, the pain relief disappeared. Here was direct proof that the relief of pain by a placebo is carried out, at least in part, by these natural opiates.</p>"
+"<p>Though scientists don’t know exactly how placebos work, they have accumulated a fair bit of knowledge about how to trigger the effect. A London rheumatologist found, for example, that red dummy capsules made more effective painkillers than blue, green, or yellow ones. Research on American students revealed that blue pills make better tranquilizers than pink, a colour more suitable for stimulants. Even branding can make a difference: If Aspro or Tylenol are what you like to take for a headache, their chemically identical generic equivalents may be less effective.</p>"
+"<p>It matters too how the treatment is delivered. Decades ago, when the major tranquilizer chlorpromazine was being introduced, a doctor in Kansas categorized his colleagues according to whether they were keen on it, openly skeptical of its benefits, or took a “let’s try and see” attitude. His conclusion: the more enthusiastic the doctor, the better the drug performed. A recent survey by Ernst on doctors’ bedside manners turned up one consistent finding: Physicians who adopt a warm, friendly, reassuring manner are more effective than those whose consultations are formal and do not offer reassurance.</p>"
+"<p>“Warm, friendly, and reassuring” are precisely what alternative treatment is all about, of course. Many of the ingredients of that opening recipe - the physical contact, the generous swaths of time, the strong hints of supernormal healing power - are just the kind of thing likely to impress patients. “It’s hardly surprising then, that complementary practitioners are generally best at mobilizing the placebo effect,” says Arthur Kleinman, professor of social anthropology at Harvard University.</p>";

 {sec:3,name:"Though + clause đảo lên đầu câu",ex:"Though scientists don’t know exactly how placebos work, they have accumulated a fair bit of knowledge.",use:"Nhượng bộ trang trọng hơn although một chút, hay dùng đầu câu trong văn học thuật."},
 {sec:3,name:"The + comparative..., the + comparative...",ex:"The more enthusiastic the doctor, the better the drug performed.",use:"Cấu trúc song hành rất được đánh giá cao. Task 2: The earlier children learn a second language, the more fluent they become."},
 {sec:3,name:"Danh từ + V-ed + that-clause (rút gọn kép)",ex:"the endorphins, natural substances produced in the brain that are known to help control pain",use:"Kết hợp appositive + rút gọn quan hệ. Giúp nén thông tin, tăng lexical density."},
 {sec:3,name:"Bị động + cụm chêm at least in part",ex:"the relief of pain by a placebo is carried out, at least in part, by these natural opiates",use:"Hedging (giảm nhẹ khẳng định) - kỹ năng bắt buộc để đạt Task Response band 7: Unemployment is caused, at least in part, by automation."}
];

var SCRIPT_URL='https://script.google.com/macros/s/AKfycbwKh4DNWdfkqiFXMRwqFmrHjjmovR5atubKduO4Yt6VdxSgdrF5ETB2k6B6owV18X2T/exec';
var TOTAL_Q=QUESTIONS.length;
function rawToBand(r){if(r>=39)return"9.0";if(r>=37)return"8.5";if(r>=35)return"8.0";if(r>=33)return"7.5";if(r>=30)return"7.0";if(r>=27)return"6.5";if(r>=23)return"6.0";if(r>=19)return"5.5";if(r>=15)return"5.0";if(r>=13)return"4.5";if(r>=10)return"4.0";if(r>=8)return"3.5";if(r>=6)return"3.0";if(r>=4)return"2.5";return"2.0"}
var TEST_SECONDS=60*60;
var studentName='',answers={},timerSec=TEST_SECONDS,timerInt=null,done=false,curSec=1,savedRange=null;

var QMAP={};
QUESTIONS.forEach(function(q){QMAP[q.qNum]=q});
QUESTIONS.forEach(function(q){
  if(q.summaryBlanks){
    q.summaryBlanks.forEach(function(n,i){
      var t=QMAP[n];if(!t)return;
      t._sumMember=true;
      if(i>0)t._sumSkip=true;
    });
  }
});

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function normFill(s){
  return String(s==null?'':s).toLowerCase().trim()
    .replace(/[\u2018\u2019]/g,"'")
    .replace(/[\u201c\u201d]/g,'"')
    .replace(/[.,;:!?]+$/,'')
    .replace(/\s+/g,' ');
}
function isCorrect(q){
  if(!q)return false;
  if(q.type==='fill'){
    var ua=normFill(answers[q.qNum]);
    if(!ua)return false;
    for(var i=0;i<q.accept.length;i++){if(normFill(q.accept[i])===ua)return true}
    return false;
  }
  var v=String(answers[q.qNum]==null?'':answers[q.qNum]).trim().toUpperCase();
  return v!==''&&v===String(q.answer).toUpperCase();
}
function groupInter(g){
  var sel=answers[g]||[];var key=GROUPS[g].answer;var n=0;
  sel.forEach(function(x){if(key.indexOf(x)>=0)n++});
  return n;
}
function statusOf(n){
  var q=QMAP[n];if(!q)return false;
  if(q.group){var g=GROUPS[q.group];return g.pair.indexOf(n)<groupInter(q.group)}
  return isCorrect(q);
}
function answeredOf(n){
  var q=QMAP[n];if(!q)return false;
  if(q.group)return (answers[q.group]||[]).length===2;
  return String(answers[n]==null?'':answers[n]).trim()!=='';
}

/* ---------- START ---------- */
document.getElementById('nameInput').addEventListener('keydown',function(e){if(e.key==='Enter')beginTest()});
function beginTest(){
  var n=document.getElementById('nameInput').value.trim();
  if(!n){document.getElementById('entryErr').style.display='block';return}
  studentName=n;show('screenTest');
  document.getElementById('barName').textContent=n;
  renderTabs();renderSection();startTimer();initResizer();
}
function show(id){
  var list=document.querySelectorAll('.screen');
  for(var i=0;i<list.length;i++)list[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}
function renderTabs(){
  var h='';
  SECTIONS.forEach(function(s){
    h+='<button class="section-tab'+(s.n===curSec?' active':'')+'" onclick="switchSection('+s.n+')">Section '+s.n+' (Q'+s.from+'-'+s.to+')</button>';
  });
  document.getElementById('secTabs').innerHTML=h;
}
function switchSection(n){
  if(n===curSec)return;
  curSec=n;renderTabs();renderSection();
  document.getElementById('passagePanel').scrollTop=0;
  document.getElementById('questionPanel').scrollTop=0;
}
function renderSection(){renderPassage();renderQuestions(done);updateNav()}

function renderPassage(){
  var s=SECTIONS[curSec-1];
  var h='<div class="passage-kicker">READING PASSAGE '+s.n+'</div><div class="passage-title">'+s.title+'</div>';
  if(s.sub)h+='<div class="passage-sub">'+s.sub+'</div>';
  h+='<div class="passage-body" id="passageBody">'+s.passage+'</div>';
  document.getElementById('passagePanel').innerHTML=h;
}

/* ---------- QUESTIONS ---------- */
function explainHTML(q){
  var e=q.explain;if(!e)return '';
  var h='<div class="fb-explain"><span class="step">Bước 1: Hiểu câu hỏi</span>'+e.step1;
  if(e.kw&&e.kw.length){
    h+='<span class="step">Bước 2: Keywords được paraphrase</span>';
    e.kw.forEach(function(k){h+='<div class="kw">- '+k+'</div>'});
    h+='<span class="step">Bước 3: So sánh và đối chiếu</span>'+e.step2;
  }else{
    h+='<span class="step">Bước 2: So sánh và đối chiếu</span>'+e.step2;
  }
  var ansTxt=(q.type==='fill')?q.display:(q.group?GROUPS[q.group].display:q.answer);
  h+='<span class="step">Bước '+(e.kw&&e.kw.length?'4':'3')+': Đáp án đúng: '+ansTxt+'</span>';
  if(e.distractors&&e.distractors.length){
    h+='<span class="step">Bước '+(e.kw&&e.kw.length?'5':'4')+': Vì sao các phương án còn lại sai</span><div class="distractor">';
    e.distractors.forEach(function(d){h+='<strong>'+d.key+'.</strong> '+d.text+'<br>'});
    h+='</div>';
  }
  if(e.tip)h+='<span class="step">Mẹo áp dụng lần sau</span>'+e.tip;
  return h+'</div>';
}

function buildSummaryCard(q,review){
  var h='<div class="sum-card">';
  if(q.summaryTitle)h+='<div class="sum-title">'+q.summaryTitle+'</div>';
  var body=q.summaryHTML;
  q.summaryBlanks.forEach(function(n){
    var sq=QMAP[n];var ua=answers[n]||'';
    var cls='';
    if(review)cls=isCorrect(sq)?' blank-ok':' blank-no';
    var badge='<span class="sum-num'+(ua?' done':'')+'" id="sn-'+n+'">'+n+'</span>';
    var inp=badge+'<input class="sum-inp'+cls+'" id="sum-inp-'+n+'" type="text" value="'+esc(ua)+'"'+(done?' disabled':'')+' oninput="pickFill('+n+',this.value)" autocomplete="off" spellcheck="false">';
    body=body.split('{{'+n+'}}').join(inp);
  });
  h+=body;
  if(review){
    h+='<div class="sum-fb">';
    q.summaryBlanks.forEach(function(n){
      var sq=QMAP[n];var ok=isCorrect(sq);
      h+='<div class="fb-item '+(ok?'ok':'no')+'" id="qc-'+n+'">';
      h+='<b>Câu '+n+':</b> '+(ok?'ĐÚNG':'SAI')+' | Bạn viết: <b>'+(answers[n]?esc(answers[n]):'(bỏ trống)')+'</b> | Đáp án: <b>'+sq.display+'</b>';
      h+=explainHTML(sq);
      h+='</div>';
    });
    h+='</div>';
  }
  return h+'</div>';
}

function buildChoiceCard(q,review){
  var ua=String(answers[q.qNum]==null?'':answers[q.qNum]);
  var ok=isCorrect(q);
  var cls=review?(ok?' is-correct':' is-wrong'):'';
  var h='<div class="q-card'+cls+'" id="qc-'+q.qNum+'"><div class="q-head"><span class="q-num'+(ua?' done':'')+'" id="qn-'+q.qNum+'">'+q.qNum+'</span><span class="q-stem">'+q.stem+'</span></div>';
  if(q.type==='matchpara'||q.type==='matchend'){
    h+='<select class="q-sel" id="sel-'+q.qNum+'" onchange="pick('+q.qNum+',this.value)"'+(done?' disabled':'')+'>';
    h+='<option value="">- select -</option>';
    q.options.forEach(function(o){
      h+='<option value="'+o.key+'"'+(ua===o.key?' selected':'')+'>'+o.key+'. '+o.text+'</option>';
    });
    h+='</select>';
  }else{
    h+='<div class="q-opts">';
    q.options.forEach(function(o){
      var lbl=(o.key===o.text)?o.text:('<strong>'+o.key+'.</strong> '+o.text);
      h+='<label class="q-opt"><input type="radio" name="q'+q.qNum+'" value="'+o.key+'"'+(ua===o.key?' checked':'')+(done?' disabled':'')+' onchange="pick('+q.qNum+',this.value)"><span>'+lbl+'</span></label>';
    });
    h+='</div>';
  }
  if(review){
    h+='<div class="fb-verdict '+(ok?'ok':'no')+'">'+(ok?'Correct':'Incorrect - Đáp án đúng: '+q.answer)+'</div>';
    h+=explainHTML(q);
  }
  return h+'</div>';
}

function buildMultiCard(q,review){
  var g=GROUPS[q.group];var sel=answers[q.group]||[];
  var inter=groupInter(q.group);
  var cls=review?(inter===2?' is-correct':' is-wrong'):'';
  var h='<div class="q-card'+cls+'" id="qc-'+g.pair[0]+'"><div class="q-head">';
  g.pair.forEach(function(n){h+='<span class="q-num'+(sel.length===2?' done':'')+'" id="qn-'+n+'">'+n+'</span>'});
  h+='<span class="q-stem">'+q.stem+'</span></div><div class="q-opts">';
  q.options.forEach(function(o){
    var on=sel.indexOf(o.key)>=0;
    h+='<label class="q-opt"><input type="checkbox" value="'+o.key+'"'+(on?' checked':'')+(done?' disabled':'')+' onchange="pickMulti(\''+q.group+'\',\''+o.key+'\',this)"><span><strong>'+o.key+'.</strong> '+o.text+'</span></label>';
  });
  h+='</div><div class="multi-hint'+(sel.length===2?' full':'')+'" id="mh-'+q.group+'">Đã chọn '+sel.length+'/2</div>';
  if(review){
    h+='<div class="fb-verdict '+(inter===2?'ok':'no')+'">'+(inter===2?'Correct (2/2)':'Đúng '+inter+'/2 - Đáp án đúng: '+g.display)+'</div>';
    h+=explainHTML(q);
  }
  return h+'</div>';
}

function renderQuestions(review){
  var h='<div class="q-block">';
  QUESTIONS.forEach(function(q){
    if(q.sec!==curSec)return;
    if(q.head)h+='<div class="q-instruction">'+q.head+'</div>';
    if(q._multiSkip)return;
    if(q._sumSkip)return;
    if(q.summaryBlanks){h+=buildSummaryCard(q,review);return}
    if(q.group){h+=buildMultiCard(q,review);return}
    h+=buildChoiceCard(q,review);
  });
  h+='</div>';
  if(review){
    var top='<div style="text-align:center;margin:0 0 16px"><button class="btn-start" style="width:auto;padding:11px 30px" onclick="showAnalysis()">View Analysis &amp; Tips</button></div>';
    h=top+h;
  }
  document.getElementById('questionPanel').innerHTML=h;
}

/* ---------- ANSWER HANDLERS ---------- */
function pick(n,v){
  if(done)return;
  answers[n]=v;
  var qn=document.getElementById('qn-'+n);
  if(qn){if(String(v).trim())qn.classList.add('done');else qn.classList.remove('done')}
  updateNav();
}
function pickFill(n,v){
  if(done)return;
  answers[n]=v;
  var sn=document.getElementById('sn-'+n);
  if(sn){if(String(v).trim())sn.classList.add('done');else sn.classList.remove('done')}
  updateNav();
}
function pickMulti(g,letter,el){
  if(done){el.checked=!el.checked;return}
  var arr=(answers[g]||[]).slice();
  var i=arr.indexOf(letter);
  if(el.checked){
    if(arr.length>=2){el.checked=false;flashHint(g);return}
    if(i<0)arr.push(letter);
  }else{
    if(i>=0)arr.splice(i,1);
  }
  answers[g]=arr;
  var hint=document.getElementById('mh-'+g);
  if(hint){hint.textContent='Đã chọn '+arr.length+'/2';hint.className='multi-hint'+(arr.length===2?' full':'')}
  GROUPS[g].pair.forEach(function(n){
    var qn=document.getElementById('qn-'+n);
    if(qn){if(arr.length===2)qn.classList.add('done');else qn.classList.remove('done')}
  });
  updateNav();
}
function flashHint(g){
  var hint=document.getElementById('mh-'+g);
  if(!hint)return;
  hint.textContent='Đã chọn đủ 2/2. Bỏ chọn một đáp án trước khi đổi.';
  setTimeout(function(){
    var arr=answers[g]||[];
    hint.textContent='Đã chọn '+arr.length+'/2';
  },1800);
}

function updateNav(){
  var h='';
  SECTIONS.forEach(function(s,si){
    if(si>0)h+='<div class="qnav-sep"></div>';
    h+='<span class="qnav-lb">P'+s.n+'</span>';
    for(var n=s.from;n<=s.to;n++){
      var cls='';
      if(done)cls=statusOf(n)?' done':' wrong';
      else if(answeredOf(n))cls=' done';
      if(s.n===curSec)cls+=' cur';
      h+='<button class="qnav-btn'+cls+'" onclick="scrollQ('+n+')">'+n+'</button>';
    }
  });
  document.getElementById('qNav').innerHTML=h;
}
function scrollQ(n){
  var q=QMAP[n];if(!q)return;
  if(q.sec!==curSec){switchSection(q.sec)}
  var target=n;
  if(q.group&&!done)target=GROUPS[q.group].pair[0];
  var el=document.getElementById('qc-'+target)||document.getElementById('sum-inp-'+target);
  if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- TIMER ---------- */
function startTimer(){
  if(timerInt)clearInterval(timerInt);
  timerInt=setInterval(function(){
    if(done){clearInterval(timerInt);return}
    timerSec--;
    if(timerSec<=0){timerSec=0;clearInterval(timerInt);forceSubmit();return}
    paintTimer();
  },1000);
  paintTimer();
}
function paintTimer(){
  var m=String(Math.floor(timerSec/60));while(m.length<2)m='0'+m;
  var s=String(timerSec%60);while(s.length<2)s='0'+s;
  var el=document.getElementById('timer');
  if(!el)return;
  el.textContent=m+':'+s;
  if(timerSec<=120)el.classList.add('warn');else el.classList.remove('warn');
}

/* ---------- SUBMIT ---------- */
function submitTest(){
  if(done)return;
  var un=0;
  for(var n=1;n<=TOTAL_Q;n++){if(!answeredOf(n))un++}
  var msg=un>0?('Bạn còn '+un+' câu chưa trả lời. Vẫn nộp bài?'):('Bạn đã trả lời đủ '+TOTAL_Q+' câu. Nộp bài ngay?');
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmOverlay').classList.add('show');
}
function closeConfirm(){document.getElementById('confirmOverlay').classList.remove('show')}
function confirmSubmitYes(){closeConfirm();doSubmit()}
function forceSubmit(){closeConfirm();doSubmit()}
function doSubmit(){
  if(done)return;
  done=true;
  if(timerInt)clearInterval(timerInt);
  var correct=0,secOk=[0,0,0];
  QUESTIONS.forEach(function(q){if(statusOf(q.qNum)){correct++;secOk[q.sec-1]++}});
  var wrong=TOTAL_Q-correct;
  var pct=Math.round((correct/TOTAL_Q)*100);
  var used=TEST_SECONDS-timerSec;
  var timeUsed=Math.floor(used/60)+'m '+(used%60)+'s';
  var band=rawToBand(correct);
  document.getElementById('resName').textContent=studentName;
  document.getElementById('resBand').innerHTML=band+'<small> / 9.0</small>';
  document.getElementById('resPct').textContent=correct+' / '+TOTAL_Q+' correct ('+pct+'%)';
  document.getElementById('resOk').textContent=correct;
  document.getElementById('resTotal').textContent=TOTAL_Q;
  document.getElementById('resNo').textContent=wrong;
  var sb='';
  SECTIONS.forEach(function(s,i){sb+='<span>Passage '+s.n+': '+secOk[i]+'/'+(s.to-s.from+1)+'</span>'});
  document.getElementById('resSec').innerHTML=sb;
  document.getElementById('overlay').classList.add('show');
  var btn=document.getElementById('btnSubmit');
  btn.textContent='SUBMITTED';btn.disabled=true;
  renderQuestions(true);updateNav();
  pushToSheets({name:studentName,correct:correct,total:TOTAL_Q,percent:pct,band:band,timeUsed:timeUsed,answers:buildPayloadAnswers()});
}
function buildPayloadAnswers(){
  var out={};
  QUESTIONS.forEach(function(q){
    if(q.group)return;
    out[String(q.qNum)]=String(answers[q.qNum]==null?'':answers[q.qNum]);
  });
  var keys=Object.keys(GROUPS);
  keys.forEach(function(g){out[g]=(answers[g]||[]).slice().sort().join('+')});
  return out;
}
function pushToSheets(data){
  var gsMsg=document.getElementById('gsMsg');
  if(!SCRIPT_URL){gsMsg.textContent='';return}
  gsMsg.textContent='Saving...';gsMsg.style.color='#888';
  fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(data),mode:'no-cors'})
    .then(function(){gsMsg.textContent='Saved';gsMsg.style.color='#2e7d32'})
    .catch(function(){gsMsg.textContent=''});
}
function reviewMode(){
  document.getElementById('overlay').classList.remove('show');
  renderQuestions(true);updateNav();
}
function restart(){
  done=false;answers={};timerSec=TEST_SECONDS;curSec=1;
  document.getElementById('overlay').classList.remove('show');
  var btn=document.getElementById('btnSubmit');btn.textContent='SUBMIT';btn.disabled=false;
  show('screenEntry');
  document.getElementById('nameInput').value='';
}

/* ---------- ANALYSIS ---------- */
function chipHTML(c){
  return '<div class="col-chip" onclick="toggleChip(this)">'+c.word+'<div class="col-detail"><div class="cd-word">'+c.word+'</div><div class="cd-ipa">'+c.ipa+'</div><div class="cd-vi">'+c.vi+'</div><div class="cd-ex">'+c.ex+'</div></div></div>';
}
function toggleChip(el){
  var open=el.classList.contains('open');
  var all=document.querySelectorAll('.col-chip');
  for(var i=0;i<all.length;i++)all[i].classList.remove('open');
  if(!open)el.classList.add('open');
}
function showAnalysis(){
  var correct=0,secOk=[0,0,0];
  QUESTIONS.forEach(function(q){if(statusOf(q.qNum)){correct++;secOk[q.sec-1]++}});
  var pct=Math.round((correct/TOTAL_Q)*100);
  var band=rawToBand(correct);
  var br=[];
  SECTIONS.forEach(function(s,i){br.push('Passage '+s.n+': '+secOk[i]+'/'+(s.to-s.from+1))});
  var h='<div class="analysis-wrap"><h2>Performance Analysis</h2><div class="asub">'+esc(studentName)+' - Band '+band+' - Raw score '+correct+'/'+TOTAL_Q+' ('+pct+'%) - '+br.join(', ')+'</div>';
  h+='<div style="margin-bottom:22px"><button class="abtn-back" style="margin-top:0" onclick="backToReview()">Back to Review</button></div>';

  h+='<div class="a-section"><h3>1. Các câu trả lời sai</h3>';
  var anyWrong=false;
  SECTIONS.forEach(function(s,si){
    var rows='';
    for(var n=s.from;n<=s.to;n++){
      if(statusOf(n))continue;
      anyWrong=true;
      var q=QMAP[n];
      var yours,keyAns;
      if(q.group){
        yours=(answers[q.group]||[]).join(', ')||'(bỏ trống)';
        keyAns=GROUPS[q.group].display;
      }else if(q.type==='fill'){
        yours=answers[n]?esc(answers[n]):'(bỏ trống)';
        keyAns=q.display;
      }else{
        yours=answers[n]?esc(answers[n]):'(bỏ trống)';
        keyAns=q.answer;
      }
      var lead=q.explain?q.explain.step1:'';
      var tip=q.explain&&q.explain.tip?q.explain.tip:'';
      rows+='<div class="a-wrong-item"><div class="aq">Câu '+n+': '+lead+'</div>';
      rows+='<div class="adetail">Bạn chọn/viết: <strong>'+yours+'</strong> | Đáp án đúng: <strong>'+keyAns+'</strong></div>';
      if(tip)rows+='<div class="adetail">Rút kinh nghiệm: '+tip+'</div>';
      rows+='</div>';
    }
    if(rows)h+='<div class="a-note"><strong>Passage '+s.n+' - '+s.title+'</strong></div>'+rows;
  });
  if(!anyWrong)h+='<div class="a-tip"><strong>Xuất sắc.</strong> Toàn bộ '+TOTAL_Q+' câu đều đúng.</div>';
  h+='</div>';

  h+='<div class="a-section"><h3>2. Collocations nên học thuộc (bấm vào từ để xem IPA, nghĩa, ví dụ)</h3>';
  SECTIONS.forEach(function(s){
    h+='<div class="a-tip"><strong>Passage '+s.n+' - '+s.title+'</strong><div class="a-vocab">';
    COLLOCATIONS.forEach(function(c){if(c.sec===s.n)h+=chipHTML(c)});
    h+='</div></div>';
  });
  h+='</div>';

  h+='<div class="a-section"><h3>3. Bảng paraphrase: đề bài so với bài đọc</h3>';
  SECTIONS.forEach(function(s){
    h+='<div class="a-note"><strong>Passage '+s.n+'</strong></div>';
    h+='<table class="ptable"><tr><th>Trong câu hỏi</th><th>Trong bài đọc</th><th>Nghĩa</th></tr>';
    PARAPHRASE.forEach(function(p){
      if(p.sec!==s.n)return;
      h+='<tr><td>'+p.q+'</td><td>'+p.p+'</td><td>'+p.vi+'</td></tr>';
    });
    h+='</table>';
  });
  h+='</div>';

  h+='<div class="a-section"><h3>4. Cấu trúc ngữ pháp lấy từ bài đọc để dùng lại trong Writing và Speaking</h3>';
  SECTIONS.forEach(function(s){
    h+='<div class="a-note"><strong>Passage '+s.n+'</strong></div>';
    GRAMMAR.forEach(function(g){
      if(g.sec!==s.n)return;
      h+='<div class="gram-box"><div class="gname">'+g.name+'</div><div class="gex">'+g.ex+'</div><div class="guse">'+g.use+'</div></div>';
    });
  });
  h+='</div>';

  h+='<div class="a-section"><h3>5. Chiến lược theo từng dạng câu hỏi</h3>';
  STRATEGY.forEach(function(st){
    h+='<div class="a-tip"><strong>'+st.name+'</strong><ul>';
    st.tips.forEach(function(t){h+='<li>'+t+'</li>'});
    h+='</ul></div>';
  });
  h+='</div>';

  h+='<button class="abtn-back" onclick="backToReview()">Back to Review</button></div>';
  document.getElementById('screenAnalysis').innerHTML=h;
  show('screenAnalysis');
  window.scrollTo(0,0);
}
function backToReview(){show('screenTest')}

/* ---------- HIGHLIGHT + NOTE ---------- */
var popup=document.getElementById('selPopup');
var noteInputWrap=document.getElementById('noteInput');
document.addEventListener('mouseup',function(e){
  if(popup.contains(e.target)||noteInputWrap.contains(e.target))return;
  setTimeout(function(){showPopup()},10);
});
function showPopup(){
  var sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.isCollapsed){hidePopup();return}
  var range=sel.getRangeAt(0);
  var container=range.commonAncestorContainer;
  var pp=document.getElementById('passagePanel'),qp=document.getElementById('questionPanel');
  if(!pp||!qp)return;
  if(!pp.contains(container)&&!qp.contains(container)){hidePopup();return}
  savedRange=range.cloneRange();
  var rect=range.getBoundingClientRect();
  popup.style.left=Math.max(8,rect.left+rect.width/2-70)+'px';
  popup.style.top=Math.max(8,rect.top-46)+'px';
  popup.classList.add('show');
}
function hidePopup(){popup.classList.remove('show');noteInputWrap.classList.remove('show')}
function wrapRange(cls,note){
  if(!savedRange)return;
  var sel=window.getSelection();
  sel.removeAllRanges();sel.addRange(savedRange);
  var mark=document.createElement('mark');
  mark.className=cls;
  if(note)mark.setAttribute('data-note',note);
  try{savedRange.surroundContents(mark)}
  catch(err){var frag=savedRange.extractContents();mark.appendChild(frag);savedRange.insertNode(mark)}
  sel.removeAllRanges();
  hidePopup();savedRange=null;
}
function applyHL(c){wrapRange('hl-'+c,null)}
function openNoteInput(){
  var rect=popup.getBoundingClientRect();
  noteInputWrap.style.left=rect.left+'px';
  noteInputWrap.style.top=(rect.bottom+6)+'px';
  noteInputWrap.classList.add('show');
  document.getElementById('noteText').value='';
  document.getElementById('noteText').focus();
}
function cancelNote(){noteInputWrap.classList.remove('show')}
function saveNote(){
  var t=document.getElementById('noteText').value.trim();
  if(!t||!savedRange)return;
  wrapRange('hl-y',t);
}
document.addEventListener('click',function(e){
  var tip=document.getElementById('noteTooltip');
  var m=e.target&&e.target.closest?e.target.closest('mark[data-note]'):null;
  if(!m){tip.classList.remove('show');return}
  var rect=m.getBoundingClientRect();
  tip.innerHTML=esc(m.getAttribute('data-note'))+'<span class="nt-close">đóng</span>';
  tip.style.left=Math.max(8,rect.left)+'px';
  tip.style.top=Math.max(8,rect.top-52)+'px';
  tip.classList.add('show');
});
function clearAllHL(){
  ['passagePanel','questionPanel'].forEach(function(id){
    var el=document.getElementById(id);if(!el)return;
    var marks=el.querySelectorAll('mark');
    for(var i=0;i<marks.length;i++){
      var m=marks[i],p=m.parentNode;
      while(m.firstChild)p.insertBefore(m.firstChild,m);
      p.removeChild(m);
    }
  });
  document.getElementById('noteTooltip').classList.remove('show');
  hidePopup();
}
document.addEventListener('scroll',function(){hidePopup()},true);

/* ---------- RESIZER ---------- */
function initResizer(){
  var rs=document.getElementById('resizer'),wrap=document.getElementById('mainWrap');
  var left=document.getElementById('passagePanel'),right=document.getElementById('questionPanel'),on=false;
  if(!rs||rs.dataset.init)return;
  rs.dataset.init='1';
  rs.addEventListener('mousedown',function(e){on=true;rs.classList.add('on');document.body.style.cursor='col-resize';document.body.style.userSelect='none';e.preventDefault()});
  document.addEventListener('mousemove',function(e){
    if(!on)return;var r=wrap.getBoundingClientRect();var pct=((e.clientX-r.left)/r.width)*100;
    if(pct<25||pct>75)return;
    left.style.flex='none';right.style.flex='none';left.style.width=pct+'%';right.style.width=(100-pct)+'%';
  });
  document.addEventListener('mouseup',function(){if(on){on=false;rs.classList.remove('on');document.body.style.cursor='';document.body.style.userSelect=''}});
  rs.addEventListener('touchstart',function(e){on=true;rs.classList.add('on');e.preventDefault()},{passive:false});
  document.addEventListener('touchmove',function(e){
    if(!on)return;var t=e.touches[0];var r=wrap.getBoundingClientRect();var pct=((t.clientX-r.left)/r.width)*100;
    if(pct<25||pct>75)return;
    left.style.flex='none';right.style.flex='none';left.style.width=pct+'%';right.style.width=(100-pct)+'%';
  },{passive:false});
  document.addEventListener('touchend',function(){if(on){on=false;rs.classList.remove('on')}});
}

/* ---------- PRIVACY DETERRENT ---------- */
var SHIELD_DEFAULT='Nội dung đã được ẩn.<br>Quay lại cửa sổ bài thi để tiếp tục.';
function showShield(msg){
  document.getElementById('shieldMsg').innerHTML=msg||SHIELD_DEFAULT;
  document.body.classList.add('shielded');
  document.getElementById('privacyShield').classList.add('show');
}
function hideShield(){
  document.body.classList.remove('shielded');
  document.getElementById('privacyShield').classList.remove('show');
}
window.addEventListener('blur',function(){showShield()});
window.addEventListener('focus',function(){hideShield()});
document.addEventListener('keyup',function(e){
  if(e.key==='PrintScreen'){
    try{navigator.clipboard.writeText(' ')}catch(err){}
    showShield('Không cho phép chụp màn hình.<br>Nội dung đã được ẩn.');
  }
});
